<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sprite Manager</title>
	<link rel="stylesheet" href="./dialog.css">
	<style>
		:root {
			--tile: 128px;
			/* displayed tile size (2x of 64px source) */
			--zoom: 2;
			/* multiplier, adjusted by zoom controls */
			--bg: #16161c;
			--panel: #22222c;
			--accent: #7c5cff;
			--danger: #ff5c7c;
			--text: #e8e8f0;
			--muted: #8a8a99;
			--checker-a: #2a2a35;
			--checker-b: #20202a;
			--selected: #ffe666;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font:
				14px / 1.4 system-ui,
				sans-serif;
		}

		#curate-panel .toolbar {
			position: sticky;
			top: 50px; /* right below the sticky header (its height) */
			z-index: 10;
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			padding: 10px 16px;
			background: var(--panel);
			border-bottom: 1px solid #333;
		}

		.toolbar-group {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.toolbar-spacer {
			flex: 1;
		}

		header {
			position: sticky;
			top: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			padding: 10px 16px;
			background: var(--panel);
			border-bottom: 1px solid #333;
		}

		header h1 {
			font-size: 16px;
			margin: 0 12px 0 0;
		}

		button {
			background: var(--accent);
			color: #fff;
			border: 0;
			border-radius: 6px;
			padding: 7px 14px;
			font-size: 13px;
			cursor: pointer;
		}

		button:hover {
			filter: brightness(1.15);
		}

		button:disabled {
			opacity: 0.4;
			cursor: default;
		}

		button.danger {
			background: var(--danger);
		}

		button.ghost {
			background: #3a3a4a;
		}

		.badge {
			display: inline-block;
			min-width: 18px;
			padding: 1px 6px;
			border-radius: 9px;
			background: #fff;
			color: var(--accent);
			font-weight: 700;
			font-size: 12px;
		}

		#status {
			color: var(--muted);
			font-size: 12px;
			margin-left: auto;
		}

		#grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(calc(var(--tile) + 16px), 1fr));
			gap: 14px;
			padding: 16px;
		}

		.card {
			background: #fff;
			border: 2px solid #bbb;
			border-radius: 0;
			padding: 8px;
			cursor: pointer;
			user-select: none;
			text-align: center;
			color: #444;
		}

		.card.selected {
			border-color: var(--selected);
			background: var(--selected);
		}

		.name {
			font-size: 12px;
			color: #333;
			margin-top: 6px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.card.selected .name {
			color: #665c00;
			font-weight: 700;
		}

		.card.drag-over {
			border-color: #000;
		}

		.card .img-wrap {
			width: var(--tile);
			height: var(--tile);
			margin: 0 auto;
			display: grid;
			place-items: center;
			overflow: hidden;
			background:
				repeating-conic-gradient(var(--checker-a) 0% 25%, var(--checker-b) 0% 50%) 0 0 / 16px 16px;
		}

		.card img {
			width: var(--tile);
			height: var(--tile);
			max-width: 100%;
			max-height: 100%;
			image-rendering: crisp-edges;
			/* fallback */
			image-rendering: pixelated;
			object-fit: contain;
		}

		.name [contenteditable] {
			font-weight: 700;
			padding: 1px 3px;
			border-radius: 3px;
			outline: none;
			cursor: text;
			caret-color: var(--accent);
		}

		.name [contenteditable]:hover {
			background: #00000012;
		}

		.name [contenteditable]:focus {
			background: #fff;
			box-shadow: 0 0 0 2px var(--accent);
		}

		.name .dup {
			box-shadow: 0 0 0 2px var(--danger);
		}

		.card.dragging {
			opacity: 0.4;
		}

		/* --- Tabs --- */
		.tab {
			background: #3a3a4a;
		}

		.tab.active {
			background: var(--accent);
		}

		/* --- Generate tab --- */
		#generate-panel {
			padding-bottom: 76px; /* keep content clear of the fixed save bar */
		}

		#gen-panel {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
			padding: 16px;
		}

		#gen-panel select,
		#gen-panel input,
		#gen-savebar input,
		.toolbar select {
			background: var(--panel);
			color: var(--text);
			border: 1px solid #3a3a4a;
			border-radius: 6px;
			padding: 7px 10px;
			font-size: 13px;
		}

		#gen-prompt {
			flex: 1;
			min-width: 240px;
		}

		#gen-panel label,
		#gen-savebar label {
			display: flex;
			align-items: center;
			gap: 4px;
			font-size: 13px;
			color: var(--text);
			cursor: pointer;
		}

		/* Fixed bottom footer of the Generate tab, holding one slot shared
		   by the size checkboxes + Save bar and the full-width error
		   message. They are mutually exclusive — while the error is
		   visible the save bar is removed, so a failed generation leaves
		   nothing to save with. */
		#gen-footer {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 10;
			background: var(--panel);
			border-top: 1px solid #333;
		}

		#gen-savebar {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 16px;
			flex-wrap: wrap;
			padding: 12px 16px;
		}

		#gen-footer:has(#gen-error.visible) #gen-savebar {
			display: none;
		}

		#gen-stage {
			display: flex;
			gap: 40px;
			padding: 24px 16px 16px;
			align-items: center;
			justify-content: center;
		}

		.gen-grid {
			text-align: center;
		}

		.gen-grid.off {
			opacity: 0.5;
		}

		.gen-grid canvas {
			background:
				repeating-conic-gradient(var(--checker-a) 0% 25%, var(--checker-b) 0% 50%) 0 0 / 16px 16px;
			border: 2px solid #3a3a4a;
			image-rendering: crisp-edges;
			/* fallback */
			image-rendering: pixelated;
		}

		.gen-grid .label {
			color: var(--muted);
			font-size: 12px;
			margin: 6px 0;
		}

		#gen-loader {
			text-align: center;
			color: var(--muted);
			font-size: 14px;
		}

		#gen-error {
			display: none;
			background: var(--danger);
			color: #fff;
			padding: 12px 16px;
			font-size: 13px;
			font-weight: 600;
			text-align: center;
		}

		#gen-error.visible {
			display: block;
		}
	</style>
</head>

<body>
	<header>
		<h1>Sprite Manager</h1>
		<button type="button" class="tab active" id="tab-generate">Generate</button>
		<button type="button" class="tab" id="tab-curate">Organize</button>
		<span id="status"></span>
	</header>

	<section id="generate-panel">
		<div id="gen-panel">
			<select id="gen-model" title="AI Gateway image model"></select>
			<input id="gen-prompt" type="text"
				placeholder="Describe the sprite… (↑/↓ to recall recent prompts)">
			<button type="button" id="gen-go">Generate</button>
		</div>
		<div id="gen-stage">
			<div class="gen-grid" data-size="128x128">
				<canvas id="gen-canvas-128" width="128" height="128" style="width: 256px; height: 256px"></canvas>
				<div class="label">128×128</div>
			</div>
			<div class="gen-grid" data-size="64x64">
				<canvas id="gen-canvas-64" width="64" height="64" style="width: 128px; height: 128px"></canvas>
				<div class="label">64×64</div>
			</div>
			<div class="gen-grid" data-size="32x32">
				<canvas id="gen-canvas-32" width="32" height="32" style="width: 64px; height: 64px"></canvas>
				<div class="label">32×32</div>
			</div>
		</div>
		<div id="gen-loader" hidden>
			Generating… <span id="gen-countdown">30</span>s
		</div>
		<footer id="gen-footer">
			<div id="gen-savebar">
				<label><input type="checkbox" id="gen-size-128" checked> 128px</label>
				<label><input type="checkbox" id="gen-size-64" checked> 64px</label>
				<label><input type="checkbox" id="gen-size-32" checked> 32px</label>
				<button type="button" id="gen-save" disabled>Save…</button>
			</div>
			<div id="gen-error" role="alert"></div>
		</footer>
	</section>

	<section id="curate-panel" hidden>
		<div class="toolbar">
			<div class="toolbar-group" role="group" aria-label="Folder and selection">
				<select id="size-select" title="Sprite size folder (independent, managed one at a time)">
					<option value="32x32">32×32</option>
					<option value="64x64" selected>64×64</option>
					<option value="128x128">128×128</option>
				</select>
				<button type="button" class="ghost" id="select-all">Select all</button>
				<button type="button" class="ghost" id="deselect-all">Deselect all</button>
				<button type="button" class="ghost" id="zoom-out">−</button>
				<button type="button" class="ghost" id="zoom-in">+</button>
			</div>
			<span class="toolbar-spacer"></span>
			<div class="toolbar-group" role="group" aria-label="Actions">
				<button type="button" id="apply-btn" disabled>
					Reorder <span class="badge" id="pending-count">0</span>
				</button>
				<button type="button" class="ghost" id="discard-btn" disabled>Discard</button>
				<button type="button" id="sheet-btn" disabled>
					Generate spritesheet (<span id="sheet-count">0</span>)
				</button>
				<button type="button" class="danger" id="delete-btn" disabled>Delete</button>
			</div>
		</div>
		<div id="grid"></div>
	</section>

	<script type="module" src="./sprite-manager-app.ts"></script>
</body>

</html>
